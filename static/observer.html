<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alpha IA - Live Tracker (Observer)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --neon: #8b5cf6; --bg: #050507; --glass: rgba(20, 20, 30, 0.65); }
    body { background-color: var(--bg); color: #cbd5e1; font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; }
    
    /* Arrière-plan Matrix subtil */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; opacity: 0.4;
      background-image: linear-gradient(var(--bg) 1px, transparent 1px), linear-gradient(90deg, var(--bg) 1px, transparent 1px);
      background-size: 30px 30px;
      background-color: #0a0a10;
    }

    /* Styles Cyberpunk */
    .glass-card {
      background: var(--glass); backdrop-filter: blur(16px);
      border: 1px solid rgba(139, 92, 246, 0.15); border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      transition: border-color 0.3s ease;
    }
    .glass-card:hover { border-color: rgba(139, 92, 246, 0.4); }
    
    .neon-text { color: #fff; text-shadow: 0 0 15px var(--neon), 0 0 30px var(--neon); }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glow-up { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.5); }
    .glow-down { color: #f87171; text-shadow: 0 0 10px rgba(248, 113, 113, 0.5); }
    
    /* Scrollbar invisible */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 4px; }

    /* Ping animation */
    .ping { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

  <!-- En-tête -->
  <header class="w-full max-w-6xl mb-8 flex items-center justify-between">
    <div>
      <h1 class="text-3xl md:text-4xl font-bold uppercase tracking-widest neon-text">Alpha IA</h1>
      <p class="text-slate-500 text-sm tracking-widest mt-1">/ PUBLIC_OBSERVER_NODE /</p>
    </div>
    <div class="flex items-center gap-2 glass-card px-4 py-2 rounded-full">
      <span class="relative flex h-3 w-3"><span class="ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-purple-500"></span></span>
      <span class="text-xs uppercase mono text-purple-300">Live Sync</span>
    </div>
  </header>

  <!-- Grille Principale -->
  <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Solde et PNL -->
    <section class="glass-card p-8 lg:col-span-1 flex flex-col justify-center items-center text-center relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-purple-500 to-transparent opacity-50"></div>
      <h2 class="text-sm text-slate-400 uppercase tracking-widest mb-4">Valeur Réseau</h2>
      <div id="obs-total" class="text-5xl md:text-6xl font-bold text-white mb-4 mono tracking-tighter">-- €</div>
      <div class="flex items-center gap-3">
        <span id="obs-pnl" class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-sm mono">-- %</span>
        <span class="text-xs text-slate-500">ROI Global</span>
      </div>
    </section>

    <!-- Graphique -->
    <section class="glass-card p-6 lg:col-span-2 relative h-[300px]">
      <canvas id="obs-chart"></canvas>
    </section>

    <!-- Actifs (Heatmap) -->
    <section class="glass-card p-6 lg:col-span-2">
      <h2 class="text-xs text-purple-400 uppercase tracking-widest mb-4 border-b border-purple-900/50 pb-2">Actifs Détenus</h2>
      <div id="obs-holdings" class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <p class="text-xs text-slate-600 col-span-full">Scan des actifs en cours...</p>
      </div>
    </section>

    <!-- Log des décisions IA -->
    <section class="glass-card p-6 lg:col-span-1 flex flex-col h-[300px]">
      <h2 class="text-xs text-purple-400 uppercase tracking-widest mb-4 border-b border-purple-900/50 pb-2">Derniers Événements</h2>
      <div id="obs-logs" class="flex-1 overflow-y-auto space-y-4 pr-2">
        <p class="text-xs text-slate-600">Connexion au flux IA...</p>
      </div>
    </section>

  </main>

  <script>
    const eur = (n) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(n ?? 0);
    const pct = (n) => `${n >= 0 ? '+' : ''}${(n ?? 0).toFixed(2)} %`;
    let chart = null;

    async function fetchObserverData() {
      try {
        const [sumRes, holdRes, histRes, decRes] = await Promise.all([
          fetch('/api/summary'), fetch('/api/holdings'),
          fetch('/api/history'), fetch('/api/decisions?limit=5')
        ]);
        
        const summary = await sumRes.json();
        const holdings = await holdRes.json();
        const history = await histRes.json();
        const decisions = await decRes.json();

        // Update KPIs
        document.getElementById('obs-total').textContent = eur(summary.total);
        const pnlEl = document.getElementById('obs-pnl');
        pnlEl.textContent = pct(summary.pnl_pct);
        pnlEl.className = `px-3 py-1 rounded-full border text-sm mono ${summary.pnl_pct >= 0 ? 'bg-emerald-500/10 border-emerald-500/30 glow-up' : 'bg-rose-500/10 border-rose-500/30 glow-down'}`;

        // Update Holdings (Mini Cards)
        const holdContainer = document.getElementById('obs-holdings');
        holdContainer.innerHTML = holdings.length ? holdings.map(h => `
          <div class="bg-black/40 border border-white/5 rounded-lg p-3 flex flex-col">
            <div class="flex justify-between items-center mb-2">
              <span class="font-bold text-white text-sm">${h.symbol}</span>
              <span class="text-[10px] ${h.pnl_pct >= 0 ? 'glow-up' : 'glow-down'} mono">${pct(h.pnl_pct)}</span>
            </div>
            <span class="text-xs text-slate-400 mono">${eur(h.value)}</span>
          </div>
        `).join('') : '<p class="text-xs text-slate-600 col-span-full">Aucun actif actuellement.</p>';

        // Update Logs
        const logContainer = document.getElementById('obs-logs');
        logContainer.innerHTML = decisions.length ? decisions.map(d => `
          <div class="border-l-2 ${d.status === 'ok' ? 'border-purple-500' : 'border-rose-500'} pl-3 py-1">
            <div class="text-[10px] text-slate-500 mono mb-1">${new Date(d.ts).toLocaleString('fr-FR')}</div>
            ${d.orders.length ? d.orders.map(o => `
              <div class="text-xs text-slate-300 mono flex gap-2">
                <span class="${o.action==='BUY' ? 'text-emerald-400' : o.action==='SELL' ? 'text-rose-400' : 'text-slate-400'}">${o.action}</span>
                <span class="text-white">${o.symbol}</span>
              </div>
            `).join('') : '<div class="text-xs text-slate-400 mono">Analyse (Aucune action)</div>'}
          </div>
        `).join('') : '<p class="text-xs text-slate-600">Aucun historique disponible.</p>';

        // Update Chart
        const labels = history.map(r => new Date(r.ts).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'}));
        const data = history.map(r => r.total);
        if (chart) {
          chart.data.labels = labels; chart.data.datasets[0].data = data; chart.update('none');
        } else {
          const ctx = document.getElementById('obs-chart').getContext('2d');
          const gradient = ctx.createLinearGradient(0, 0, 0, 300);
          gradient.addColorStop(0, 'rgba(139, 92, 246, 0.4)'); gradient.addColorStop(1, 'rgba(139, 92, 246, 0)');
          
          chart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{
                data, borderColor: '#8b5cf6', backgroundColor: gradient, borderWidth: 2,
                fill: true, pointRadius: 0, pointHitRadius: 10, tension: 0.4
            }]},
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
              scales: {
                x: { display: false },
                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { family: 'JetBrains Mono' } } }
              }
            }
          });
        }
      } catch(e) { console.error("Sync error", e); }
    }

    // Lancement et boucle toutes les 30 secondes
    fetchObserverData();
    setInterval(fetchObserverData, 30000);
  </script>
</body>
</html>
